# Serves the built SPA and proxies /api to the API Service (same namespace).
# Runs as non-root (nginx-unprivileged), so it listens on 8080.
server {
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json font/woff2;

	server_tokens off;
	client_max_body_size 1m;

	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	location /api/ {
		proxy_pass http://api:5050;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# keep the chain Cloudflare/Envoy already built; the API trusts TRUST_PROXY hops of it
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_connect_timeout 5s;
		proxy_read_timeout 30s;
	}

	# health endpoint for the pod probes
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# hashed build assets: cache for a year
	location ^~ /assets/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	# static files from /public (images, 3D models, icons)
	location ~* \.(?:png|jpe?g|gif|svg|webp|ico|glb|gltf|woff2?|pdf)$ {
		expires 30d;
		add_header Cache-Control "public, max-age=2592000";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	# SPA fallback; index.html must never be cached so new deploys show up
	location / {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		try_files $uri /index.html;
	}
}
